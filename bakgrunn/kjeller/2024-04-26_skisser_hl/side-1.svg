<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1240" height="1753" viewBox="0 0 1240 1753">
<title>Forenklet teknisk tegning – søylefundament</title>
<desc>Redigerbar vektortegning rekonstruert fra håndskisse. Horisontale og vertikale streker er rettet opp. Mål er gjengitt som opplysninger fra skissen, ikke en fullstendig målfast geometrimodell.</desc>
<style>
  .line{fill:none;stroke:#20252a;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
  .thin{fill:none;stroke:#343a40;stroke-width:1.35}
  .heavy{fill:none;stroke:#20252a;stroke-width:3}
  .dim{fill:none;stroke:#4b5563;stroke-width:1.65}
  .dash{fill:none;stroke:#475569;stroke-width:1.6;stroke-dasharray:10 10}
  .txt{font-family:Arial,Helvetica,sans-serif;fill:#1f2933;font-size:24px}
  .small{font-size:18px}
  .label{font-size:23px}
  .note{font-size:25px}
</style>
<!-- Tegningsramme -->
<g id="ramme" class="thin"><rect x="54" y="58" width="1120" height="1636"/></g>
<!-- Tittelfelt -->
<g id="tittelfelt">
 <text x="614" y="92" text-anchor="middle" class="txt" style="font-size:26px">Sivilingeniørene Harboe og Leganger AS</text>
 <text x="614" y="114" text-anchor="middle" class="txt" style="font-size:14px">Telefon: 73 99 28 30     firmapost@h-l.no</text>
