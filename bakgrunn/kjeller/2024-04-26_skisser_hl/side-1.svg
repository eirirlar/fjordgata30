 <text x="130" y="188" class="txt">21/4-26</text>
 <text x="329" y="188" class="txt small">Mål:</text>
 <text x="383" y="188" class="txt">1:20</text>
 <text x="599" y="188" class="txt small">Sign:</text>
 <text x="690" y="188" class="txt">OAS</text>
</g>
<!-- Skjematisk snitt: rettede horisontale og vertikale kanter -->
<g id="snitt">
