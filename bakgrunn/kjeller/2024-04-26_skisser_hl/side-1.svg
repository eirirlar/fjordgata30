 <path id="terrenglinje" class="line" d="M54 747 H1174"/>
 <!-- Topp fundament / støpeskjøt -->
 <path id="fundamenttopp" class="line" d="M54 879 H1174"/>
 <!-- Fundament, snitt gjennom blokk -->
 <rect id="fundament" x="290" y="879" width="590" height="119" class="heavy"/>
 <!-- Søyle og forankring (skjematisk) -->
 <path id="soyle" class="heavy" d="M536 748 V505 Q536 496 548 495 Q583 491 625 431 L625 748"/>
 <path id="soyleavslutning" class="line" d="M548 495 Q587 501 625 431"/>
 <path id="skjult_soyle" class="dash" d="M536 748 V879 M625 748 V879"/>
 <!-- Søylenote med leder -->
 <path class="line" d="M670 574 Q637 579 585 630"/>
 <text x="683" y="580" class="txt note">SØYLE</text>
 <!-- Prinsippskisse fugesbånd -->
 <g id="fugesband">
  <path class="heavy" d="M307 843 V909 M863 843 V909"/>
  <rect x="327" y="860" width="13" height="16" fill="#20252a"/>
  <rect x="834" y="860" width="13" height="16" fill="#20252a"/>
