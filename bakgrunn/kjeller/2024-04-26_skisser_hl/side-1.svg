  <path class="line" d="M914 885 L937 887 M914 885 L927 906"/>
  <text x="948" y="1009" class="txt note">FUGEBLIKK +</text>
  <text x="948" y="1044" class="txt note">SVELLEBÅND</text>
 </g>
 <text x="362" y="924" class="txt label">FUNDAMENT</text>
 <text x="362" y="959" class="txt label">STØPES FØRST</text>
</g>
<!-- Lengde- og høydemål. Måltekst gjengitt fra skissen -->
<g id="maal">
