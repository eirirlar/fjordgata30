<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1753" viewBox="0 0 1240 1753">
<title>Snitt bunnplate ved vegg – opprettet fra håndskisse</title>
<desc>Forenklet og opprettet teknisk skisse. Alle tekster er tekstobjekter, dimensjoner og bygningsdeler er separate grupper.</desc>
<style>
  .frame{stroke:#292929;stroke-width:1.5;fill:none}
  .structure{stroke:#171717;stroke-width:3;fill:none;stroke-linecap:square;stroke-linejoin:miter}
  .detail{stroke:#171717;stroke-width:2.5;fill:none;stroke-linejoin:miter}
  .dim{stroke:#353535;stroke-width:1.8;fill:none}
  .leader{stroke:#333;stroke-width:1.8;fill:none}
  text{font-family:Arial,Helvetica,sans-serif;fill:#181818}
  .caption{font-size:29px}
  .annotation{font-size:30px}
  .small{font-size:19px}
  .field{font-size:17px}
</style>
